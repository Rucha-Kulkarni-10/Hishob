server:
  port: ${PORT:8080}

spring:
  application:
    name: api-gateway
  config:
    import: "optional:configserver:${CONFIG_SERVER_URL:http://localhost:8888}"
  cloud:
    gateway:
      server:
        webflux:
          default-filters:
            - RemoveRequestHeader=X-Internal-Token
          routes:
            - id: auth-service
              uri: ${AUTH_SERVICE_URL:lb://auth-service}
              predicates:
                - Path=/api/auth/**
            - id: auth-service-friends-core
              uri: ${AUTH_SERVICE_URL:lb://auth-service}
              predicates:
                - Path=/api/friends/requests/**
            - id: auth-service-friends-list
              uri: ${AUTH_SERVICE_URL:lb://auth-service}
              predicates:
                - Path=/api/friends
            - id: auth-service-friends-block
              uri: ${AUTH_SERVICE_URL:lb://auth-service}
              predicates:
                - Path=/api/friends/{targetUserId}/block
            - id: auth-service-friends-remove
              uri: ${AUTH_SERVICE_URL:lb://auth-service}
              predicates:
                - Path=/api/friends/{friendUserId}
                - Method=DELETE
            - id: auth-service-users
              uri: ${AUTH_SERVICE_URL:lb://auth-service}
              predicates:
                - Path=/api/users/**
            - id: expense-service-personal-expenses
              uri: ${EXPENSE_SERVICE_URL:lb://expense-service}
              predicates:
                - Path=/api/personal-expenses/**
            - id: expense-service-friend-expenses
              uri: ${EXPENSE_SERVICE_URL:lb://expense-service}
              predicates:
                - Path=/api/friends/*/expenses/**
            - id: expense-service-expenses
              uri: ${EXPENSE_SERVICE_URL:lb://expense-service}
              predicates:
                - Path=/api/expenses/**
            - id: expense-service-group-expenses
              uri: ${EXPENSE_SERVICE_URL:lb://expense-service}
              predicates:
                - Path=/api/groups/*/expenses/**
            - id: balance-service-personal
              uri: ${SETTLEMENT_SERVICE_URL:lb://settlement-service}
              predicates:
                - Path=/api/personal-balances/**
            - id: balance-service-friend-balance
              uri: ${SETTLEMENT_SERVICE_URL:lb://settlement-service}
              predicates:
                - Path=/api/friends/*/balance
            - id: balance-service
              uri: ${SETTLEMENT_SERVICE_URL:lb://settlement-service}
              predicates:
                - Path=/api/groups/*/balances
            - id: settlement-service-personal
              uri: ${SETTLEMENT_SERVICE_URL:lb://settlement-service}
              predicates:
                - Path=/api/personal-settlements/**
            - id: settlement-service-friend-settlements
              uri: ${SETTLEMENT_SERVICE_URL:lb://settlement-service}
              predicates:
                - Path=/api/friends/*/settlements
            - id: settlement-service-history
              uri: ${SETTLEMENT_SERVICE_URL:lb://settlement-service}
              predicates:
                - Path=/api/groups/*/settlements/history
            - id: settlement-service
              uri: ${SETTLEMENT_SERVICE_URL:lb://settlement-service}
              predicates:
                - Path=/api/groups/*/settlements
            - id: notification-service
              uri: ${AUTH_SERVICE_URL:lb://auth-service}
              predicates:
                - Path=/api/notifications/**
            - id: expense-service-groups
              uri: ${EXPENSE_SERVICE_URL:lb://expense-service}
              predicates:
                - Path=/api/groups/**

eureka:
  client:
    enabled: ${EUREKA_CLIENT_ENABLED:true}
    register-with-eureka: ${EUREKA_REGISTER_WITH_EUREKA:true}
    fetch-registry: ${EUREKA_FETCH_REGISTRY:true}
    service-url:
      defaultZone: ${EUREKA_SERVER_URL:http://localhost:8761/eureka/}
