
# =============================================================================
# HISHOB Render Blueprint Specification
# =============================================================================
# Architecture:
#   - 1 PostgreSQL database with isolated schemas
#   - 4 Docker Web Services: Gateway, Auth, Expense, Settlement
#   - Inter-service REST calls via public HTTPS URLs
#   - Render-managed JWT and internal-service secrets
# =============================================================================

version: "1"

databases:
  # WARNING: Render Free PostgreSQL expires after 30 days.
  # Do not rely on it for durable production user data.
  - name: hishob-postgres
    databaseName: hishob_db
    user: hishob_user
    plan: free
    region: oregon

envVarGroups:
  - name: hishob-shared
    envVars:
      - key: JWT_SECRET
        generateValue: true
      - key: INTERNAL_SERVICE_TOKEN
        generateValue: true
      - key: DB_SSLMODE
        value: require
      - key: EUREKA_CLIENT_ENABLED
        value: "false"
      - key: EUREKA_REGISTER_WITH_EUREKA
        value: "false"
      - key: EUREKA_FETCH_REGISTRY
        value: "false"
      - key: AUTH_SERVICE_URL
        value: https://hishob-auth-service.onrender.com
      - key: EXPENSE_SERVICE_URL
        value: https://hishob-expense-service.onrender.com
      - key: SETTLEMENT_SERVICE_URL
        value: https://hishob-settlement-service.onrender.com

services:
  # ---------------------------------------------------------------------------
  # 1. API Gateway
  # ---------------------------------------------------------------------------
  - type: web
    name: hishob-gateway
    env: docker
    dockerfilePath: ./gateway/api-gateway/Dockerfile
    dockerContext: .
    plan: free
    region: oregon
    healthCheckPath: /health
    envVars:
      - fromGroup: hishob-shared
      - key: CORS_ALLOWED_ORIGINS
        value: "https://hishob-web.vercel.app,http://localhost:5173"

  # ---------------------------------------------------------------------------
  # 2. Auth Service
  # ---------------------------------------------------------------------------
  - type: web
    name: hishob-auth-service
    env: docker
    dockerfilePath: ./services/auth-service/Dockerfile
    dockerContext: .
    plan: free
    region: oregon
    healthCheckPath: /health
    envVars:
      - fromGroup: hishob-shared
      - key: DB_HOST
        fromDatabase:
          name: hishob-postgres
          property: host
      - key: DB_PORT
        fromDatabase:
          name: hishob-postgres
          property: port
      - key: DB_NAME
        fromDatabase:
          name: hishob-postgres
          property: database
      - key: DB_USERNAME
        fromDatabase:
          name: hishob-postgres
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: hishob-postgres
          property: password
      - key: DB_SCHEMA
        value: hishob_auth

  # ---------------------------------------------------------------------------
  # 3. Expense Service (also owns groups and memberships)
  # ---------------------------------------------------------------------------
  - type: web
    name: hishob-expense-service
    env: docker
    dockerfilePath: ./services/expense-service/Dockerfile
    dockerContext: .
    plan: free
    region: oregon
    healthCheckPath: /health
    envVars:
      - fromGroup: hishob-shared
      - key: DB_HOST
        fromDatabase:
          name: hishob-postgres
          property: host
      - key: DB_PORT
        fromDatabase:
          name: hishob-postgres
          property: port
      - key: DB_NAME
        fromDatabase:
          name: hishob-postgres
          property: database
      - key: DB_USERNAME
        fromDatabase:
          name: hishob-postgres
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: hishob-postgres
          property: password
      - key: DB_SCHEMA
        value: hishob_expense

  # ---------------------------------------------------------------------------
  # 4. Settlement Service (owns balances + settlements)
  # ---------------------------------------------------------------------------
  - type: web
    name: hishob-settlement-service
    env: docker
    dockerfilePath: ./services/settlement-service/Dockerfile
    dockerContext: .
    plan: free
    region: oregon
    healthCheckPath: /health
    envVars:
      - fromGroup: hishob-shared
      - key: DB_HOST
        fromDatabase:
          name: hishob-postgres
          property: host
      - key: DB_PORT
        fromDatabase:
          name: hishob-postgres
          property: port
      - key: DB_NAME
        fromDatabase:
          name: hishob-postgres
          property: database
      - key: DB_USERNAME
        fromDatabase:
          name: hishob-postgres
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: hishob-postgres
          property: password
      - key: DB_SCHEMA
        value: hishob_settlement
