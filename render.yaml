
# =============================================================================
# HISHOB Render Blueprint Specification
# =============================================================================
# Architecture:
#   - External PostgreSQL provided by Neon (no Render-managed database)
#   - 4 Docker Web Services: Gateway, Auth, Expense, Settlement
#   - Inter-service REST calls via public HTTPS URLs
#   - Render-managed JWT and internal-service secrets
#
# Database: Neon project rapid-mud-38475345, branch "production".
#   Render free PostgreSQL expired/expires after 30 days, so the managed
#   "databases:" resource has been removed. Each service keeps using the
#   existing DB_HOST / DB_PORT / DB_NAME / DB_USERNAME / DB_PASSWORD /
#   DB_SCHEMA / DB_SSLMODE placeholders in its application.yml.
#
#   DB_PASSWORD is declared with "sync: false": Render asks for its value in
#   the Dashboard when the Blueprint is first applied and never stores it in
#   this file. Later Blueprint syncs ignore this key, so rotate it from the
#   Dashboard, not here.
#
#   These values assume one Neon database ("neondb") holding one schema per
#   service. If the migration instead creates a database per service, change
#   each DB_NAME and set DB_SCHEMA to public, matching the local setup.
#
#   If a service ever needs JDBC options that application.yml cannot express
#   through these placeholders (for example channel_binding=require, or a
#   pooled Neon endpoint), set SPRING_DATASOURCE_URL for that service as a
#   Dashboard-only secret instead of editing the placeholder template.
# =============================================================================

version: "1"

envVarGroups:
  - name: hishob-shared
    envVars:
      - key: JWT_SECRET
        generateValue: true
      - key: INTERNAL_SERVICE_TOKEN
        generateValue: true
      - key: DB_SSLMODE
        value: require
      - key: EUREKA_CLIENT_ENABLED
        value: "false"
      - key: EUREKA_REGISTER_WITH_EUREKA
        value: "false"
      - key: EUREKA_FETCH_REGISTRY
        value: "false"
      - key: AUTH_SERVICE_URL
        value: https://hishob-auth-service.onrender.com
      - key: EXPENSE_SERVICE_URL
        value: https://hishob-expense-service.onrender.com
      - key: SETTLEMENT_SERVICE_URL
        value: https://hishob-settlement-service.onrender.com

services:
  # ---------------------------------------------------------------------------
  # 1. API Gateway
  # ---------------------------------------------------------------------------
  - type: web
    name: hishob-gateway
    env: docker
    dockerfilePath: ./gateway/api-gateway/Dockerfile
    dockerContext: .
    plan: free
    region: oregon
    healthCheckPath: /health
    envVars:
      - fromGroup: hishob-shared
      - key: CORS_ALLOWED_ORIGINS
        value: "https://hishob-one.vercel.app,http://localhost:5173"

  # ---------------------------------------------------------------------------
  # 2. Auth Service
  # ---------------------------------------------------------------------------
  - type: web
    name: hishob-auth-service
    env: docker
    dockerfilePath: ./services/auth-service/Dockerfile
    dockerContext: .
    plan: free
    region: oregon
    healthCheckPath: /health
    envVars:
      - fromGroup: hishob-shared
      - key: DB_HOST
        value: ep-small-hall-b4p77kw2.c-6.us-east-2.aws.neon.tech
      - key: DB_PORT
        value: "5432"
      - key: DB_NAME
        value: neondb
      - key: DB_USERNAME
        value: neondb_owner
      - key: DB_PASSWORD
        sync: false
      - key: DB_SCHEMA
        value: hishob_auth

  # ---------------------------------------------------------------------------
  # 3. Expense Service (also owns groups and memberships)
  # ---------------------------------------------------------------------------
  - type: web
    name: hishob-expense-service
    env: docker
    dockerfilePath: ./services/expense-service/Dockerfile
    dockerContext: .
    plan: free
    region: oregon
    healthCheckPath: /health
    envVars:
      - fromGroup: hishob-shared
      - key: DB_HOST
        value: ep-small-hall-b4p77kw2.c-6.us-east-2.aws.neon.tech
      - key: DB_PORT
        value: "5432"
      - key: DB_NAME
        value: neondb
      - key: DB_USERNAME
        value: neondb_owner
      - key: DB_PASSWORD
        sync: false
      - key: DB_SCHEMA
        value: hishob_expense

  # ---------------------------------------------------------------------------
  # 4. Settlement Service (owns balances + settlements)
  # ---------------------------------------------------------------------------
  - type: web
    name: hishob-settlement-service
    env: docker
    dockerfilePath: ./services/settlement-service/Dockerfile
    dockerContext: .
    plan: free
    region: oregon
    healthCheckPath: /health
    envVars:
      - fromGroup: hishob-shared
      - key: DB_HOST
        value: ep-small-hall-b4p77kw2.c-6.us-east-2.aws.neon.tech
      - key: DB_PORT
        value: "5432"
      - key: DB_NAME
        value: neondb
      - key: DB_USERNAME
        value: neondb_owner
      - key: DB_PASSWORD
        sync: false
      - key: DB_SCHEMA
        value: hishob_settlement
