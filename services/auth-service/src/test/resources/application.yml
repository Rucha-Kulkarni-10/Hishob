server:
  port: 0

spring:
  application:
    name: auth-service
  datasource:
    url: jdbc:h2:mem:authdb;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  jpa:
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
  cloud:
    config:
      enabled: false

eureka:
  client:
    enabled: false
    register-with-eureka: false
    fetch-registry: false

jwt:
  secret: hishob-test-jwt-secret-for-automated-tests-only-0123456789abcdef
  expiration: 86400000

mailgun:
  enabled: false

auth:
  email-verification:
    required: false
    token-validity-seconds: 86400
    resend-cooldown-seconds: 60
    frontend-url: http://localhost:3000
    verification-path: /verify-email

# InternalAuthFilter reads hishob.internal.token with no fallback, so the test
# context must supply it. Test-only value; it never appears in src/main.
hishob:
  internal:
    token: hishob-test-internal-token-for-automated-tests-only


