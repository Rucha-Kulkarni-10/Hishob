server:
  port: ${PORT:8084}

spring:
  application:
    name: balance-service
  config:
    import: "optional:configserver:${CONFIG_SERVER_URL:http://localhost:8888}"

eureka:
  client:
    enabled: ${EUREKA_CLIENT_ENABLED:true}
    register-with-eureka: ${EUREKA_REGISTER_WITH_EUREKA:true}
    fetch-registry: ${EUREKA_FETCH_REGISTRY:true}
    service-url:
      defaultZone: ${EUREKA_SERVER_URL:http://localhost:8761/eureka/}

jwt:
  secret: ${JWT_SECRET}

hishob:
  expense-service:
    base-url: ${EXPENSE_SERVICE_URL:http://localhost:8083}
    internal-token: ${INTERNAL_SERVICE_TOKEN}
  auth-service:
    base-url: ${AUTH_SERVICE_URL:http://localhost:8081}
    internal-token: ${INTERNAL_SERVICE_TOKEN}
  settlement-service:
    base-url: ${SETTLEMENT_SERVICE_URL:http://localhost:8085}
    internal-token: ${INTERNAL_SERVICE_TOKEN}
  internal:
    token: ${INTERNAL_SERVICE_TOKEN}
