server:
  port: ${PORT:8083}

spring:
  application:
    name: expense-service
  config:
    import: "optional:configserver:${CONFIG_SERVER_URL:http://localhost:8888}"
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:hishob_expense}?currentSchema=${DB_SCHEMA:hishob_expense}&sslmode=${DB_SSLMODE:prefer}}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
    open-in-view: false

eureka:
  client:
    enabled: ${EUREKA_CLIENT_ENABLED:true}
    register-with-eureka: ${EUREKA_REGISTER_WITH_EUREKA:true}
    fetch-registry: ${EUREKA_FETCH_REGISTRY:true}
    service-url:
      defaultZone: ${EUREKA_SERVER_URL:http://localhost:8761/eureka/}

jwt:
  secret: ${JWT_SECRET:d3f4u1t-s3cr3t-k3y-f0r-h1sh0b-auth-s3rv1c3-jwt-t0k3n-g3n3r4t10n-2026}

hishob:
  auth-service:
    base-url: ${AUTH_SERVICE_URL:http://localhost:8081}
    internal-token: ${INTERNAL_SERVICE_TOKEN:dev-internal-token-hishob-service-2026}
  settlement-service:
    base-url: ${SETTLEMENT_SERVICE_URL:http://localhost:8085}
    internal-token: ${INTERNAL_SERVICE_TOKEN:dev-internal-token-hishob-service-2026}
  internal:
    token: ${INTERNAL_SERVICE_TOKEN:dev-internal-token-hishob-service-2026}
