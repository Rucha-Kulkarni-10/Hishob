server:
  port: 0

spring:
  application:
    name: expense-service
  datasource:
    url: jdbc:h2:mem:hishob_expense_test;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    database-platform: org.hibernate.dialect.H2Dialect
  cloud:
    config:
      enabled: false

eureka:
  client:
    enabled: false
    register-with-eureka: false
    fetch-registry: false

jwt:
  secret: hishob-test-jwt-secret-for-automated-tests-only-0123456789abcdef

hishob:
  auth-service:
    base-url: http://localhost:9999
    internal-token: hishob-test-internal-token-for-automated-tests-only
  internal:
    token: hishob-test-internal-token-for-automated-tests-only
