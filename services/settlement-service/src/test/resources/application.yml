server:
  port: 0

spring:
  application:
    name: settlement-service
  cloud:
    config:
      enabled: false
  datasource:
    url: jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: create-drop
    open-in-view: false

eureka:
  client:
    enabled: false
    register-with-eureka: false
    fetch-registry: false

jwt:
  secret: hishob-test-jwt-secret-for-automated-tests-only-0123456789abcdef

hishob:
  expense-service:
    base-url: http://localhost:9995
    internal-token: hishob-test-internal-token-for-automated-tests-only
  auth-service:
    base-url: http://localhost:9996
    internal-token: hishob-test-internal-token-for-automated-tests-only
  internal:
    token: hishob-test-internal-token-for-automated-tests-only
